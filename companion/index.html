<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32 Marauder</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0d1117;
    --surface:  #161b22;
    --border:   #30363d;
    --green:    #00ff41;
    --green-dim:#00cc33;
    --yellow:   #e3b341;
    --red:      #f85149;
    --text:     #c9d1d9;
    --muted:    #8b949e;
    --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-mono); }

  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── header ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--green);
    letter-spacing: 0.05em;
  }

  .status-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 0.78rem;
    background: #21262d;
    border: 1px solid var(--border);
    user-select: none;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .dot.connected    { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.connecting   { background: var(--yellow); animation: pulse 1s infinite; }
  .dot.disconnected { background: var(--red); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  .status-label { color: var(--text); }
  .status-port  { color: var(--muted); font-size: 0.72rem; }

  /* ── quick actions ── */
  .actions {
    display: flex;
    gap: 6px;
    padding: 8px 16px;
    flex-wrap: wrap;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .btn {
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #21262d;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .btn:hover { border-color: var(--green-dim); color: var(--green); background: #0d1117; }
  .btn:active { background: #0a1a0a; }
  .btn.danger:hover { border-color: var(--red); color: var(--red); }

  /* ── terminal ── */
  #terminal {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    font-size: 0.85rem;
    line-height: 1.55;
    scroll-behavior: smooth;
  }

  #terminal::-webkit-scrollbar { width: 6px; }
  #terminal::-webkit-scrollbar-track { background: transparent; }
  #terminal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .line { white-space: pre-wrap; word-break: break-all; }
  .line.sys { color: var(--muted); font-style: italic; }
  .line.tx  { color: var(--green-dim); }
  .line.err { color: var(--red); }

  /* ── input bar ── */
  .input-bar {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .prompt { color: var(--green); align-self: center; font-size: 1rem; }

  #cmd {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s;
  }
  #cmd:focus { border-color: var(--green-dim); }

  #send {
    padding: 6px 16px;
    background: var(--green-dim);
    color: #000;
    border: none;
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  #send:hover { background: var(--green); }

  .auto-scroll-btn {
    padding: 6px 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 0.75rem;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .auto-scroll-btn.active { color: var(--green); border-color: var(--green-dim); }
</style>
</head>
<body>

<header>
  <span class="logo">&#9889; MARAUDER</span>
  <div class="status-chip">
    <div class="dot connecting" id="dot"></div>
    <span class="status-label" id="statusLabel">Connecting…</span>
    <span class="status-port" id="statusPort"></span>
  </div>
</header>

<div class="actions">
  <button class="btn" data-cmd="scanap">scanap</button>
  <button class="btn" data-cmd="stopscan">stopscan</button>
  <button class="btn" data-cmd="sniffbeacon">sniffbeacon</button>
  <button class="btn" data-cmd="stopsniff">stopsniff</button>
  <button class="btn" data-cmd="sniffpmkid">sniffpmkid</button>
  <button class="btn" data-cmd="list">list</button>
  <button class="btn" data-cmd="help">help</button>
  <button class="btn danger" data-cmd="clearap">clearap</button>
  <button class="btn danger" data-cmd="clearst">clearst</button>
</div>

<div id="terminal"></div>

<div class="input-bar">
  <span class="prompt">&gt;</span>
  <input id="cmd" type="text" placeholder="Enter command…" autocomplete="off" spellcheck="false">
  <button class="auto-scroll-btn active" id="autoScrollBtn" title="Toggle auto-scroll">&#8595; Auto</button>
  <button id="send">Send</button>
</div>

<script>
(() => {
  const terminal   = document.getElementById('terminal');
  const cmdInput   = document.getElementById('cmd');
  const sendBtn    = document.getElementById('send');
  const dot        = document.getElementById('dot');
  const statusLabel= document.getElementById('statusLabel');
  const statusPort = document.getElementById('statusPort');
  const autoScrollBtn = document.getElementById('autoScrollBtn');

  const MAX_LINES   = 2000;
  const HISTORY_MAX = 50;
  const WS_PORT     = location.port ? +location.port + 1 : 2338;
  const WS_URL      = `ws://${location.hostname}:${WS_PORT}`;

  let ws        = null;
  let autoScroll= true;
  let history   = [];
  let histIdx   = -1;
  let lineCount = 0;
  let retryDelay= 500;

  // ── terminal output ──────────────────────────────────────────────────────

  function addLine(text, cls = '') {
    const div = document.createElement('div');
    div.className = 'line' + (cls ? ' ' + cls : '');
    div.textContent = text;
    terminal.appendChild(div);
    lineCount++;
    while (lineCount > MAX_LINES) {
      terminal.removeChild(terminal.firstChild);
      lineCount--;
    }
    if (autoScroll) terminal.scrollTop = terminal.scrollHeight;
  }

  // ── WebSocket ────────────────────────────────────────────────────────────

  function connect() {
    setStatus('connecting');
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      retryDelay = 500;
      addLine('WebSocket connected.', 'sys');
    };

    ws.onmessage = e => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.type === 'status') {
        if (msg.connected) {
          setStatus('connected', msg.port, msg.baud);
          addLine(`Device connected on ${msg.port} @ ${msg.baud} baud`, 'sys');
        } else {
          setStatus('disconnected');
          addLine('Device disconnected — waiting for USB…', 'sys');
        }
      } else if (msg.type === 'output') {
        addLine(msg.text);
      }
    };

    ws.onclose = () => {
      setStatus('disconnected');
      addLine(`WebSocket closed — reconnecting in ${(retryDelay/1000).toFixed(1)} s…`, 'sys');
      setTimeout(connect, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 10000);
    };

    ws.onerror = () => ws.close();
  }

  function send(cmd) {
    if (!cmd) return;
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(cmd);
      addLine('> ' + cmd, 'tx');
    } else {
      addLine('Not connected.', 'err');
    }
  }

  // ── status chip ──────────────────────────────────────────────────────────

  function setStatus(state, port, baud) {
    dot.className = 'dot ' + state;
    const labels = { connected: 'Connected', connecting: 'Connecting…', disconnected: 'Disconnected' };
    statusLabel.textContent = labels[state] || state;
    statusPort.textContent  = port ? `${port} · ${baud}` : '';
  }

  // ── command input ────────────────────────────────────────────────────────

  function submitCmd() {
    const cmd = cmdInput.value.trim();
    if (!cmd) return;
    history.unshift(cmd);
    if (history.length > HISTORY_MAX) history.pop();
    histIdx = -1;
    cmdInput.value = '';
    send(cmd);
  }

  cmdInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') { submitCmd(); return; }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      histIdx = Math.min(histIdx + 1, history.length - 1);
      cmdInput.value = history[histIdx] ?? '';
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      histIdx = Math.max(histIdx - 1, -1);
      cmdInput.value = histIdx < 0 ? '' : history[histIdx];
    }
  });

  sendBtn.addEventListener('click', submitCmd);

  // ── quick-action buttons ─────────────────────────────────────────────────

  document.querySelectorAll('[data-cmd]').forEach(btn => {
    btn.addEventListener('click', () => send(btn.dataset.cmd));
  });

  // ── auto-scroll toggle ───────────────────────────────────────────────────

  autoScrollBtn.addEventListener('click', () => {
    autoScroll = !autoScroll;
    autoScrollBtn.classList.toggle('active', autoScroll);
  });

  terminal.addEventListener('scroll', () => {
    const atBottom = terminal.scrollHeight - terminal.scrollTop - terminal.clientHeight < 40;
    if (atBottom && !autoScroll) {
      autoScroll = true;
      autoScrollBtn.classList.add('active');
    }
  });

  // ── init ─────────────────────────────────────────────────────────────────

  setStatus('connecting');
  cmdInput.focus();
  connect();
})();
</script>
</body>
</html>
